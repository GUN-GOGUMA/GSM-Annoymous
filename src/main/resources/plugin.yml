name: GSM-Annoymous
version: ${version}
main: dev.gungoguma.annoymous.GsmAnnoymous
api-version: '26.2'
author: GUNGOGUMA
description: GSM anonymous nickname and skin plugin.

commands:
  hide_nick:
    description: Toggle anonymous nickname.
    usage: /hide_nick
    permission: gsmannoymous.command.hide_nick
  hide_skin:
    description: Toggle anonymous skin.
    usage: /hide_skin
    permission: gsmannoymous.command.hide_skin
  annoymous:
    description: Manage GSM-Annoymous.
    usage: /annoymous <reload|status|reset|regenerate>

permissions:
  gsmannoymous.command.hide_nick:
    description: Allows toggling anonymous nickname.
    default: true
  gsmannoymous.command.hide_skin:
    description: Allows toggling anonymous skin.
    default: true
  gsmannoymous.admin.reload:
    description: Allows reloading GSM-Annoymous config.
    default: op
  gsmannoymous.admin.status:
    description: Allows viewing anonymous status.
    default: op
  gsmannoymous.admin.reset:
    description: Allows resetting or regenerating anonymous data.
    default: op
